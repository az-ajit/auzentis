// ============================= WEBAUTHN HELPERS =============================
function bufferToBase64url(buf){
  const bytes = new Uint8Array(buf);
  let binary = "";
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function base64urlToBuffer(b64url){
  const pad = "=".repeat((4 - (b64url.length % 4)) % 4);
  const base64 = (b64url + pad).replace(/-/g,"+").replace(/_/g,"/");
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
function getCurrentPosition(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error("This browser doesn't support location.")); return; }
    navigator.geolocation.getCurrentPosition(
      (pos)=>resolve(pos.coords),
      (err)=>reject(new Error(err.message)),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  });
}

function haversineMetersClient(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showBlockedScreen(msg){
  const overlay = document.getElementById("loadingOverlay");
  if(overlay) overlay.remove();
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "none";
  document.getElementById("blockedMark").src = LOGO_MARK;
  document.getElementById("blockedMessage").textContent = msg;
  document.getElementById("blockedScreen").style.display = "block";
}

// Everyone except Admin/Director must be physically at the office to use the
// app at all — not just to punch in. The login screen itself can't be hidden
// (this is a static site with no server to gate delivery), but nothing past
// login is reachable from outside the configured office radius.
async function checkOfficeLocationGate(){
  if(currentProfile.role === "Admin" || currentProfile.role === "Director") return true;

  // Remote-eligible (WFH) employees skip the office-radius gate entirely —
  // checked directly via a targeted query since loadDB() (which populates
  // DB.employees) hasn't run yet at this point in startup.
  if(currentProfile.emp_id){
    const { data: empRow } = await sb.from("employees").select("is_remote").eq("id", currentProfile.emp_id).maybeSingle();
    if(empRow && empRow.is_remote) return true;
  }

  const { data: srow } = await sb.from("settings").select("data").eq("id", 1).maybeSingle();
  const s = (srow && srow.data) || {};
  if(typeof s.officeLat !== "number" || typeof s.officeLng !== "number"){
    showBlockedScreen("Office location isn't set up yet. Ask your Admin to configure it in Settings.");
    return false;
  }

  let coords;
  try{
    coords = await getCurrentPosition();
  }catch(e){
    showBlockedScreen("Location access is required to use this application. Please allow location permission in your browser, then try again.");
    return false;
  }

  const radius = typeof s.officeRadiusM === "number" ? s.officeRadiusM : 150;
  const distance = haversineMetersClient(coords.latitude, coords.longitude, s.officeLat, s.officeLng);
  if(distance > radius){
    logAudit("access_blocked_offsite", "profiles", currentProfile.emp_id, {distanceMeters: Math.round(distance), radiusMeters: radius}).catch(()=>{});
    showBlockedScreen("This is a private/proprietary product and cannot be accessed outside Auzentis office premises.");
    return false;
  }
  return true;
}

async function enrollFingerprint(){
  const btn = document.getElementById("enrollFpBtn");
  try{
    if(btn){ btn.disabled = true; btn.textContent = "Enrolling…"; }
    const { data: optData, error: optErr } = await sb.functions.invoke("webauthn-enroll-options", { body: {} });
    if(optErr){ toast("Could not start enrollment: " + (await extractFnError(optErr)), true); return; }
    if(optData && optData.error){ toast(optData.error, true); return; }

    const options = optData.options;
    const publicKey = {
      ...options,
      challenge: base64urlToBuffer(options.challenge),
      user: { ...options.user, id: base64urlToBuffer(options.user.id) },
      excludeCredentials: (options.excludeCredentials||[]).map(c=>({...c, id: base64urlToBuffer(c.id)})),
    };

    let credential;
    try{
      credential = await navigator.credentials.create({ publicKey });
    }catch(e){
      console.error("WebAuthn create failed:", e);
      toast("Fingerprint enrollment failed or was cancelled: " + e.message, true);
      return;
    }

    const responseJson = {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        attestationObject: bufferToBase64url(credential.response.attestationObject),
        transports: credential.response.getTransports ? credential.response.getTransports() : [],
      },
      clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
    };

    const label = val("fp_device_label").trim() || null;
    const { data, error } = await sb.functions.invoke("webauthn-enroll-verify", {
      body: { response: responseJson, device_label: label }
    });
    if(error){ toast("Could not save fingerprint: " + (await extractFnError(error)), true); return; }
    if(data && data.error){ toast(data.error, true); return; }

    toast("Fingerprint enrolled on this device.");
    await loadMyDevices();
    renderAll();
  }catch(e){
    console.error(e);
    toast("Could not enroll fingerprint: " + e.message, true);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Enroll My Fingerprint"; }
  }
}

async function removeDevice(credentialId){
  if(!confirm("Remove this device? You'll need to enroll again to punch in/out from it.")) return;
  const { error } = await sb.from("webauthn_credentials").delete().eq("credential_id", credentialId);
  if(error){ toast("Could not remove device: " + error.message, true); return; }
  await loadMyDevices();
  toast("Device removed.");
  renderAll();
}

// Admins/Directors are never restricted — this calls the plain punch-attendance function.
async function punchDirect(kind){
  try{
    const { data, error } = await sb.functions.invoke("punch-attendance", { body: { kind } });
    if(error){
      console.error("Punch failed:", error);
      toast("Could not punch " + kind + ": " + (await extractFnError(error)), true);
      return;
    }
    if(data && data.error){ toast(data.error, true); return; }
    toast(kind==="in" ? "Punched in." : "Punched out.");
    await loadDB();
    renderAll();
  }catch(e){
    console.error(e);
    toast("Could not punch " + kind + ": " + e.message, true);
  }
}

// Everyone else needs a fingerprint check (their own enrolled device) plus GPS proof
// they're within office radius, both verified server-side in webauthn-punch-verify.
async function punchWithFingerprint(kind){
  try{
    let coords;
    try{
      coords = await getCurrentPosition();
    }catch(e){
      toast("Could not get your location: " + e.message + " — location access is required to punch in/out.", true);
      return;
    }

    const { data: optData, error: optErr } = await sb.functions.invoke("webauthn-punch-options", { body: {} });
    if(optErr){ toast("Could not start fingerprint check: " + (await extractFnError(optErr)), true); return; }
    if(optData && optData.error){ toast(optData.error, true); return; }

    const options = optData.options;
    const publicKey = {
      ...options,
      challenge: base64urlToBuffer(options.challenge),
      allowCredentials: (options.allowCredentials||[]).map(c=>({...c, id: base64urlToBuffer(c.id)})),
    };

    let assertion;
    try{
      assertion = await navigator.credentials.get({ publicKey });
    }catch(e){
      console.error("WebAuthn get failed:", e);
      toast("Fingerprint check failed or was cancelled: " + e.message, true);
      return;
    }

    const responseJson = {
      id: assertion.id,
      rawId: bufferToBase64url(assertion.rawId),
      type: assertion.type,
      response: {
        clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
        authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
        signature: bufferToBase64url(assertion.response.signature),
        userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : undefined,
      },
      clientExtensionResults: assertion.getClientExtensionResults ? assertion.getClientExtensionResults() : {},
    };

    const { data, error } = await sb.functions.invoke("webauthn-punch-verify", {
      body: { kind, response: responseJson, lat: coords.latitude, lng: coords.longitude }
    });
    if(error){ toast("Could not punch " + kind + ": " + (await extractFnError(error)), true); return; }
    if(data && data.error){ toast(data.error, true); return; }

    toast(kind==="in" ? "Punched in." : "Punched out.");
    await loadDB();
    renderAll();
  }catch(e){
    console.error(e);
    toast("Could not punch " + kind + ": " + e.message, true);
  }
}

async function punchAction(kind){
  const isPrivileged = currentProfile && (currentProfile.role === "Admin" || currentProfile.role === "Director");
  if(isPrivileged) await punchDirect(kind);
  else await punchWithFingerprint(kind);
}

// ============================= LEAVES =============================
function leaveDays(l){
  const from = new Date(l.fromDate+"T00:00:00"), to = new Date(l.toDate+"T00:00:00");
  return Math.max(1, Math.round((to-from)/86400000)+1);
}
function leaveBalance(empId, year){
  const s = DB.settings;
  const used = {Casual:0, Sick:0, Earned:0};
  DB.leaves.filter(l=>l.empId===empId && l.status==="Approved" && new Date(l.fromDate).getFullYear()===year)
    .forEach(l=>{ if(used[l.type]!==undefined) used[l.type]+=leaveDays(l); });
  return {
    Casual: {quota:s.casualLeaveQuota, used:used.Casual, balance:s.casualLeaveQuota-used.Casual},
    Sick: {quota:s.sickLeaveQuota, used:used.Sick, balance:s.sickLeaveQuota-used.Sick},
    Earned: {quota:s.earnedLeaveQuota, used:used.Earned, balance:s.earnedLeaveQuota-used.Earned}
  };
}

let leaveSearch = "";
let leaveStatusFilter = "";
let selectedLeaveIds = new Set();

function renderLeaves(){
  const scoped = currentRole==="Employee";
  const empId = scoped ? currentEmpId : null;
  let list = (scoped ? DB.leaves.filter(l=>l.empId===empId) : DB.leaves.slice())
    .sort((a,b)=>b.fromDate.localeCompare(a.fromDate));

  if(!scoped && leaveSearch.trim()){
    const q = leaveSearch.trim().toLowerCase();
    list = list.filter(l=>{
      const emp = DB.employees.find(e=>e.id===l.empId);
      return [l.empId, emp?emp.name:'', l.reason].some(v=>v && v.toLowerCase().includes(q));
    });

  const { pageItems: leavePage, page: lvPage, totalPages: lvTotalPages, total: lvTotal } = paginate(list, "leaves", 20);
  const rows = leavePage.map(l=>{
    const emp = DB.employees.find(e=>e.id===l.empId);
    return `<tr data-id="${l.id}">
      ${scoped ? '' : `<td><input type="checkbox" class="rowCheck leaveCheck" data-id="${l.id}" ${selectedLeaveIds.has(l.id)?'checked':''}></td>`}

      <td>${l.reason||''}</td>
      <td><span class="pill ${l.status==='Approved'?'ok':l.status==='Rejected'?'warn':''}">${l.status}</span></td>
      <td class="actions">
        ${(!scoped && l.status==="Pending") ? `<button class="btn ghost sm approveLeaveBtn">Approve</button><button class="btn danger sm rejectLeaveBtn">Reject</button>` : ''}

        <button class="btn danger sm delLeaveBtn">Delete</button>
      </td>
    </tr>`;
  }).join("");

  const year = new Date().getFullYear();
  const balanceRows = (scoped ? DB.employees.filter(e=>e.id===empId) : DB.employees).map(e=>{
    const b = leaveBalance(e.id, year);
    return `<tr><td>${e.id}</td><td>${e.name}</td>

      <td class="num">${b.Sick.balance} / ${b.Sick.quota}</td>
      <td class="num">${b.Earned.balance} / ${b.Earned.quota}</td></tr>`;
  }).join("");

  return `
  <div class="card">
    <h2>Leave Balance — ${year}</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Casual</th><th>Sick</th><th>Earned</th></tr></thead>
        <tbody>${balanceRows}</tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <h2>Leave Requests</h2>
    ${scoped ? '' : `
    <div class="table-toolbar">
      <div class="field search-field" style="margin:0;"><input type="text" id="leaveSearchInput" placeholder="Search by employee or reason…" value="${escapeHtml(leaveSearch)}"></div>
      <select id="leaveStatusFilter">
        <option value="">All Statuses</option>
        ${["Pending","Approved","Rejected"].map(s=>`<option value="${s}" ${leaveStatusFilter===s?'selected':''}>${s}</option>`).join("")}
      </select>
    </div>
    ${selectedLeaveIds.size ? `<div class="bulk-actions"><span class="helptext">${selectedLeaveIds.size} selected</span><button class="btn danger sm" id="bulkDeleteLeaveBtn">Delete Selected</button></div>` : ''}`}
    <div class="tablewrap">
      <table>
        <thead><tr>${scoped?'':'<th><input type="checkbox" id="leaveCheckAll"></th>'}<th>ID</th><th>Name</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="${scoped?9:10}" class="empty">No leave requests match.</td></tr>`}</tbody>
      </table>

// ============================= EXPORT ENGINE =============================
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvEscape(v){
  const s = (v===null||v===undefined) ? "" : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(","), ...rows.map(r=>r.map(csvEscape).join(","))];
  downloadBlob(filename+".csv", lines.join("\r\n"), "text/csv;charset=utf-8;");
  toast("CSV downloaded.");
}
function exportXLSX(filename, headers, rows, sheetName){
  if(typeof XLSX === "undefined"){ toast("Excel library did not load — try CSV instead.", true); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (sheetName||"Report").slice(0,31));
  XLSX.writeFile(wb, filename+".xlsx");
  toast("Excel file downloaded.");
}
function exportPDF(filename, title, headers, rows){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation: headers.length>6 ? "landscape":"portrait", unit:"pt", format:"a4"});
    const marginX = 36; let y = 50;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();

    doc.setFontSize(14); doc.setTextColor(27,36,84);
    doc.text("Auzentis Private Limited", marginX, y); y+=18;
    doc.setFontSize(11); doc.setTextColor(60,60,60);
    doc.text(title, marginX, y); y+=16;
    doc.setDrawColor(200,200,200); doc.line(marginX, y, pageW-marginX, y); y+=14;

    const usableW = pageW - marginX*2;
    const colW = usableW / headers.length;
    doc.setFontSize(8.5);

    function drawHeader(){
      doc.setFillColor(240,242,246); doc.rect(marginX, y-11, usableW, 16, "F");
      doc.setTextColor(27,36,84); doc.setFont(undefined,"bold");
      headers.forEach((h,i)=>doc.text(String(h), marginX + i*colW + 3, y));
      doc.setFont(undefined,"normal"); doc.setTextColor(30,30,30);
      y += 15;
    }
    drawHeader();
    rows.forEach(r=>{
      if(y > pageH - 40){ doc.addPage(); y = 50; drawHeader(); }
      r.forEach((cell,i)=>{
        let text = cell===null||cell===undefined? "" : String(cell);
        if(text.length > 22) text = text.slice(0,21)+"…";
        doc.text(text, marginX + i*colW + 3, y);
      });
      y += 14;
    });
    doc.save(filename+".pdf");
    toast("PDF downloaded.");
  }catch(err){
    console.error(err);
    toast("Could not generate PDF: "+err.message, true);
  }
}

function round2(n){ return Math.round((n||0)*100)/100; }

function quickRange(kind){
  const today = new Date();
  const iso = d => d.toISOString().slice(0,10);
  if(kind==="today") return {from: iso(today), to: iso(today)};
  if(kind==="week"){ const d=new Date(today); d.setDate(d.getDate()-6); return {from:iso(d), to:iso(today)}; }
  if(kind==="month"){ const d=new Date(today.getFullYear(), today.getMonth(), 1); return {from:iso(d), to:iso(today)}; }
  if(kind==="year"){ const d=new Date(today.getFullYear(), 0, 1); return {from:iso(d), to:iso(today)}; }
  return {from:"1900-01-01", to:"2100-12-31"}; // all time
}

    <div class="tablewrap">
      <table>
        <thead><tr><th>Name</th><th>Assign Role</th><th></th></tr></thead>
        <tbody>${pendingRows}</tbody>
      </table>
    </div>
  </div>` : ''}
  <div class="card">
    <h2>Team &amp; Roles</h2>
    <div class="sub">Manage who has access and what they can see.</div>
    <p class="helptext">"Delete" here revokes their access to the app but does not delete their underlying login account — for that, remove them from Supabase → Authentication → Users directly.</p>
    <div class="table-toolbar">
      <div class="field search-field" style="margin:0;"><input type="text" id="teamSearchInput" placeholder="Search by name…" value="${escapeHtml(teamSearch)}"></div>
      <select id="teamRoleFilter">
        <option value="">All Roles</option>
        ${Object.keys(ROLE_TABS).map(r=>`<option value="${r}" ${teamRoleFilter===r?'selected':''}>${r}</option>`).join("")}
      </select>
    </div>
    ${selectedTeamIds.size ? `<div class="bulk-actions"><span class="helptext">${selectedTeamIds.size} selected</span><button class="btn danger sm" id="bulkDeleteTeamBtn">Delete Selected</button></div>` : ''}
    <div class="tablewrap">
      <table>
        <thead><tr><th><input type="checkbox" id="teamCheckAll"></th><th>Name</th><th>Role</th><th>Linked Employee (for "Employee" role)</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="empty">No team members match.</td></tr>`}</tbody>
      </table>
    </div>
    ${renderPager("team", teamPage, teamTotalPages, teamTotal)}
  </div>
  ${renderAuditLogCard()}`;
}

function renderAuditLogCard(){
  const { pageItems: logPage, page: alPage, totalPages: alTotalPages, total: alTotal } = paginate(auditLog, "auditLog", 25);
  const rows = logPage.map(a=>`
    <tr>
      <td>${new Date(a.created_at).toLocaleString()}</td>
      <td>${a.actor_name||'—'}</td>
      <td>${a.action}</td>
      <td>${a.table_name||''} ${a.record_id?('#'+a.record_id):''}</td>
      <td>${a.detail ? `<span class="helptext">${escapeHtml(JSON.stringify(a.detail))}</span>` : ''}</td>
    </tr>`).join("");
  return `
  <div class="card">
    <h2>Activity Log</h2>
    <div class="sub">Who changed what, most recent first. Read-only, kept for accountability.</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Detail</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="empty">No activity recorded yet.</td></tr>`}</tbody>
      </table>
    </div>
    ${renderPager("auditLog", alPage, alTotalPages, alTotal)}
  </div>`;
}

function attachHandlers(){

    const addPlanBtn = document.getElementById("addPlanBtn");

    });
    document.querySelectorAll(".delPlanBtn").forEach(b=>b.onclick=async (e)=>{

      DB.bonusPlans = DB.bonusPlans.filter(p=>p.id!==id);

    const addTierBtn = document.getElementById("addTierBtn");

    document.querySelectorAll(".removeTierBtn").forEach(b=>b.onclick=()=>{

    const addSlabBtn = document.getElementById("addSlabBtn");

      syncBonusRuleDraftFromDom();

    };
    document.querySelectorAll(".removeSlabBtn").forEach(b=>b.onclick=()=>{

      renderAll();
    });
    const addPlanRuleBtn = document.getElementById("addPlanRuleBtn");
    if(addPlanRuleBtn) addPlanRuleBtn.onclick = async ()=>{
      syncBonusRuleDraftFromDom();
      const planId = addPlanRuleBtn.dataset.plan;
      const plan = DB.bonusPlans.find(p=>p.id===planId);
      if(!plan){ toast("Select a plan first.", true); return; }
      const name = bonusRuleDraftName.trim();
      if(!name){ toast("Enter a rule name.", true); return; }
      let rule;
      if(bonusRuleDraftType==="attendance"){
        if(!(bonusRuleDraftAmount>0)){ toast("Bonus amount must be greater than 0.", true); return; }
        rule = {id:newId("BR"), name, type:"attendance", amount:bonusRuleDraftAmount};
      } else if(bonusRuleDraftType==="quality"){
        const tiers = bonusRuleDraftTiers.filter(t=>t.amount>0);
        if(!tiers.length){ toast("Add at least one tier with an amount greater than 0.", true); return; }
        rule = {id:newId("BR"), name, type:"quality", tiers};
      } else {
        const slabs = bonusRuleDraftSlabs.filter(s=>s.rate>0 || s.upTo!=null);
        if(!slabs.length){ toast("Add at least one slab.", true); return; }
        rule = {id:newId("BR"), name, type:"production", slabs};

      plan.rules = (plan.rules||[]).filter(r=>r.id!==ruleId);
      await save("bonusPlans");
      await logAudit("update", "bonus_plans", planId, {removedRule:ruleId});

    });

    const saveChampDefaultsBtn = document.getElementById("saveChampDefaultsBtn");

      await save("settings");
      await logAudit("update", "settings", null, {championAmounts:true});
      toast("Champion Bonus defaults saved.");
    };
  }

  if(activeTab==="Employees"){
    document.querySelectorAll(".editEmpBtn").forEach(b=>b.onclick=(e)=>{

      document.getElementById("f_dob").value = emp.dob||"";
      document.getElementById("f_email").value = emp.email||"";
      document.getElementById("f_resign").value = emp.resignDate||"";
      document.getElementById("f_status").value = emp.status;
      document.getElementById("f_remote").value = emp.isRemote ? "1" : "";
      document.getElementById("f_basic").value = emp.basic;
      document.getElementById("f_hra").value = emp.hra;
      document.getElementById("f_other").value = emp.other;
      document.getElementById("salaryFieldsGroup").style.display = "none";
      document.getElementById("salaryFieldsNote").style.display = "block";

    document.querySelectorAll(".delEmpBtn").forEach(b=>b.onclick=async (e)=>{
      const id = e.target.closest("tr").dataset.id;
      if(!confirm("Delete employee "+id+"? This cannot be undone.")) return;
      const emp = DB.employees.find(x=>x.id===id);
      DB.employees = DB.employees.filter(x=>x.id!==id);
      await save("employees");
      await logAudit("delete", "employees", id, {name: emp?emp.name:null});
      toast("Employee deleted.");
      renderAll();
    });
    document.getElementById("cancelEmpBtn").onclick = ()=>renderAll();
    document.getElementById("saveEmpBtn").onclick = async ()=>{
      const editingId = val("empEditingId");
      const id = editingId || val("f_id").trim();
      const name = val("f_name").trim();
      if(!id || !name){ toast("Emp ID and Name are required.", true); return; }
      if(!editingId && DB.employees.some(x=>x.id===id)){ toast("Emp ID already exists.", true); return; }
      const basic = parseFloat(val("f_basic"))||0, hra = parseFloat(val("f_hra"))||0, other = parseFloat(val("f_other"))||0;
      if(basic<0 || hra<0 || other<0){ toast("Basic, HRA, and Other Allowance cannot be negative.", true); return; }
      const doj = val("f_doj") || "2026-01-01", resignDate = val("f_resign") || "";
      if(resignDate && resignDate < doj){ toast("Resigning Date cannot be before Date of Joining.", true); return; }
      const record = {
        id, name, doj, status: val("f_status"),
        dob: val("f_dob") || "", email: val("f_email").trim() || "", resignDate,
        basic, hra, other, isRemote: val("f_remote")==="1"
      };
      if(editingId){
        const idx = DB.employees.findIndex(x=>x.id===editingId);
        DB.employees[idx] = record;
      } else {
        DB.employees.push(record);
        const d = new Date(doj+"T00:00:00");
        DB.salaryStructures.push({ id:newId("SS"), empId:id, effMonth:d.getMonth()+1, effYear:d.getFullYear(),
          basic, hra, components: other ? [{name:"Other Allowance", amount:other}] : [] });
        await save("salaryStructures");
      }
      await save("employees");
      await logAudit(editingId ? "update" : "create", "employees", id, {name});
      toast("Employee saved.");
      renderAll();
    };

    document.getElementById("importCsvInput").onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;

      reader.onload = async ()=>{

        e.target.value = "";
      };
      reader.readAsText(file);
    };
    document.getElementById("downloadCsvTemplateBtn").onclick = ()=>{

        "Emp ID,Name,DOJ,DOB,Email,Resigning Date,Status,Basic,HRA,Other\n,Jane Doe,2026-01-15,1995-04-20,jane@auzentis.com,,Active,7500,3000,4500\n",
        "text/csv;charset=utf-8;");

    document.getElementById("empSearchInput").oninput = (e)=>{

      const newInput = document.getElementById("empSearchInput");
      if(newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }

      employeeStatusFilter = e.target.value;

      renderAll();

    document.querySelectorAll(".empCheck").forEach(cb=>cb.onchange=()=>{

      DB.employees = DB.employees.filter(x=>!selectedEmployeeIds.has(x.id));
      await save("employees");
      await logAudit("bulk_delete", "employees", null, {ids});
      selectedEmployeeIds.clear();
      toast(`${ids.length} employee(s) deleted.`);
      renderAll();
    };

    const salStructEmpSelect = document.getElementById("salStructEmpSelect");
    if(salStructEmpSelect) salStructEmpSelect.onchange = (e)=>{

    };
    const addBucketBtn = document.getElementById("addBucketBtn");
    if(addBucketBtn) addBucketBtn.onclick = ()=>{
      syncSalStructDraftFromDom();
      salStructDraftComponents.push({name:"", amount:0});
      renderAll();
    };
    document.querySelectorAll(".removeBucketBtn").forEach(b=>b.onclick=()=>{
      syncSalStructDraftFromDom();
      salStructDraftComponents.splice(parseInt(b.dataset.idx), 1);
      renderAll();
    });
    document.querySelectorAll(".editSalStructBtn").forEach(b=>b.onclick=()=>{

    });
    document.querySelectorAll(".delSalStructBtn").forEach(b=>b.onclick=async ()=>{
      const id = b.dataset.id;

      DB.salaryStructures = DB.salaryStructures.filter(s=>s.id!==id);
      await save("salaryStructures");
      await logAudit("delete", "salary_structures", id, null);

      toast("Revision deleted.");
      renderAll();

    const cancelSalStructEditBtn = document.getElementById("cancelSalStructEditBtn");

      resetSalStructDraft();
      renderAll();
    };

    if(saveSalStructBtn) saveSalStructBtn.onclick = async ()=>{
      syncSalStructDraftFromDom();

      if(salStructDraftBasic<0 || salStructDraftHra<0){ toast("Basic and HRA cannot be negative.", true); return; }
      const components = salStructDraftComponents.filter(c=>c.name.trim());
      if(components.some(c=>c.amount<0)){ toast("Bucket amounts cannot be negative.", true); return; }
      const now = new Date();
      const minYear = now.getFullYear(), minMonth = now.getMonth()+1;
      if(salStructEffYear < minYear || (salStructEffYear===minYear && salStructEffMonth < minMonth)){
        toast("Effective date can't be in the past — pick the current month or later, so past payroll and payslips stay untouched.", true);
        return;
      }
      const emp = DB.employees.find(x=>x.id===salStructEmpId);
      // Update in place if we're explicitly editing a revision, or if one
      // already exists for this employee+month+year — prevents duplicate
      // rows (which made "current structure" ambiguous) instead of always
      // appending a new one.
      let target = salStructEditingId ? DB.salaryStructures.find(s=>s.id===salStructEditingId) : null;
      if(!target) target = DB.salaryStructures.find(s=>s.empId===salStructEmpId && s.effMonth===salStructEffMonth && s.effYear===salStructEffYear);
      const values = {
        basic: salStructDraftBasic, hra: salStructDraftHra,

        bonusPlanId: salStructDraftBonusPlanId || null,
        effMonth: salStructEffMonth, effYear: salStructEffYear
      };
      if(target){
        Object.assign(target, values);

        DB.salaryStructures.push({ id: newId("SS"), empId: salStructEmpId, ...values });

      await save("salaryStructures");
      await logAudit("update", "salary_structures", salStructEmpId, {effMonth:salStructEffMonth, effYear:salStructEffYear});
      toast(`Salary structure updated for ${emp?emp.name:salStructEmpId}, effective ${monthName(salStructEffMonth)} ${salStructEffYear}.`);
      resetSalStructDraft();
      renderAll();
    };
  }

  if(activeTab==="Payroll"){
    document.getElementById("loadPeriodBtn").onclick = async ()=>{
      const btn = document.getElementById("loadPeriodBtn");
      btn.disabled = true; btn.textContent = "Loading…";

      if(negative){ toast("Leaves, TDS, and LOP Hours cannot be negative.", true); return; }

      document.querySelectorAll(".tdsInput").forEach(inp=>{
        upsertPayroll(payrollPeriod.month, payrollPeriod.year, inp.dataset.emp, {tds: parseFloat(inp.value)||0});
      });
      document.querySelectorAll(".lopInput").forEach(inp=>{
        upsertPayroll(payrollPeriod.month, payrollPeriod.year, inp.dataset.emp, {lopHours: parseFloat(inp.value)||0});
      });
      document.querySelectorAll(".qualityInput").forEach(inp=>{
        const q = inp.value.trim()==="" ? null : parseFloat(inp.value);
        upsertPayroll(payrollPeriod.month, payrollPeriod.year, inp.dataset.emp, {quality: q});
      });
      document.querySelectorAll(".unitsInput").forEach(inp=>{
        const u = inp.value.trim()==="" ? null : parseFloat(inp.value);
        upsertPayroll(payrollPeriod.month, payrollPeriod.year, inp.dataset.emp, {units: u});
      });
      // Clear any previous Champion Award holders for this period, then
      // assign whoever's currently selected in the 4 award dropdowns.
      document.querySelectorAll(".leavesInput").forEach(inp=>{
        upsertPayroll(payrollPeriod.month, payrollPeriod.year, inp.dataset.emp, {championLabel:null, championAmount:null});
      });

function upsertPayroll(month,year,empId,patch){

}

  Object.assign(e, patch);
}

// ============================= PDF EXPORT =============================
async function buildPayslipPdf(){
  const area = document.getElementById("payslipPrintArea");
  if(!area) throw new Error("Nothing to export.");
  const canvas = await html2canvas(area, {scale:2, backgroundColor:"#ffffff"});
  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"pt", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const imgWidth = pageWidth - 60;
  const imgHeight = canvas.height * (imgWidth/canvas.width);
  pdf.addImage(imgData, "PNG", 30, 30, imgWidth, imgHeight);
  const emp = DB.employees.find(e=>e.id===payslipState.empId);
  const filename = `Payslip_${emp?emp.name:payslipState.empId}_${monthName(payslipState.month)}_${payslipState.year}.pdf`;
  return { pdf, filename, emp };
}

async function downloadPayslipPdf(){
  const btn = document.getElementById("downloadPdfBtn");
  btn.textContent = "Generating…"; btn.disabled = true;
  try{
    const { pdf, filename } = await buildPayslipPdf();
    pdf.save(filename);
    toast("Payslip PDF downloaded.");
  }catch(err){
    console.error(err);
    toast("Could not generate PDF: "+err.message, true);
  }finally{
    btn.textContent = "Download PDF"; btn.disabled = false;
  }
}

let bulkEmailInProgress = false;
async function emailAllPayslips(){
  if(bulkEmailInProgress){ toast("Already sending payslips, please wait.", true); return; }
  const testCb = document.getElementById("ps_testMode");
  const testEmail = (testCb && testCb.checked) ? currentUser.email : null;
  const targets = DB.employees.filter(e=>bulkEmailSelectedIds.has(e.id));
  if(!targets.length){ toast("No employees selected. Check the ones you want to email in the Bulk Email Payslips list.", true); return; }
  if(!confirm((testEmail ? `TEST MODE — all payslips will go to ${testEmail} instead.\n\n` : '') + `Email payslips to ${targets.length} selected employee(s) for ${monthName(payslipState.month)} ${payslipState.year}?`)) return;

  bulkEmailInProgress = true;
  const originalEmpId = payslipState.empId;
  let sent = 0, skipped = 0;
  const skippedNames = [];

  for(let i=0;i<targets.length;i++){
    const emp = targets[i];
    payslipState.empId = emp.id;
    renderAll();
    const progressEl = document.getElementById("bulkEmailProgress");
    if(progressEl) progressEl.textContent = `Sending ${i+1} of ${targets.length}: ${emp.name}…`;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    if(!testEmail && !emp.email){ skipped++; skippedNames.push(emp.name+" (no email on file)"); continue; }
    try{
      const { pdf, filename } = await buildPayslipPdf();
      const base64 = pdf.output("datauristring").split(",")[1];
      const { data, error } = await sb.functions.invoke("send-payslip-email", {
        body: { emp_id: emp.id, month: payslipState.month, year: payslipState.year, filename, pdf_base64: base64, test_email: testEmail || undefined }
      });
      if(error){ skipped++; skippedNames.push(emp.name+": "+(await extractFnError(error))); continue; }
      if(data && data.error){ skipped++; skippedNames.push(emp.name+": "+data.error); continue; }
      sent++;
    }catch(err){
      skipped++; skippedNames.push(emp.name+": "+err.message);
    }
  }

  payslipState.empId = originalEmpId;
  bulkEmailInProgress = false;
  renderAll();
  toast(`Emailed ${sent} payslip(s)` + (skipped ? `, skipped ${skipped}: ${skippedNames.join("; ")}` : "") + ".", skipped>0);
}

async function emailPayslip(){
  const btn = document.getElementById("emailPayslipBtn");
  const testCb = document.getElementById("ps_testMode");
  const testEmail = (testCb && testCb.checked) ? currentUser.email : null;
  btn.textContent = "Sending…"; btn.disabled = true;
  try{
    const { pdf, filename, emp } = await buildPayslipPdf();
    if(!testEmail && (!emp || !emp.email)){
      toast("This employee has no email address on file. Add one in the Employees tab.", true);
      return;
    }
    const base64 = pdf.output("datauristring").split(",")[1];
    const { data, error } = await sb.functions.invoke("send-payslip-email", {
      body: { emp_id: payslipState.empId, month: payslipState.month, year: payslipState.year, filename, pdf_base64: base64, test_email: testEmail || undefined }
    });
    if(error){ toast("Could not email payslip: " + (await extractFnError(error)), true); return; }
    if(data && data.error){ toast(data.error, true); return; }
    toast("Payslip emailed to " + (testEmail || emp.email) + (testEmail ? " (test)" : "") + ".");
  }catch(err){
    console.error(err);
    toast("Could not email payslip: "+err.message, true);
  }finally{
    btn.textContent = "Email Payslip"; btn.disabled = false;
  }
}

function setAuthMode(mode){
  const isSignup = mode === "signup";
  const isReset = mode === "reset";
  document.getElementById("authTitle").textContent = isReset ? "Set New Password" : (isSignup ? "Create Account" : "Sign In");
  document.getElementById("authNameField").style.display = isSignup ? "block" : "none";
  document.getElementById("authEmailField").style.display = isReset ? "none" : "block";
  document.getElementById("auth_password").placeholder = isReset ? "New password (at least 6 characters)" : "At least 6 characters";
  document.getElementById("authSubmitBtn").textContent = isReset ? "Set New Password" : (isSignup ? "Sign Up" : "Sign In");
  document.getElementById("authToggleLink").style.display = isReset ? "none" : "inline";
  document.getElementById("authToggleLink").textContent = isSignup ? "Already have an account? Sign in" : "Need an account? Sign up";
  document.getElementById("authForgotLink").parentElement.style.display = (isReset || isSignup) ? "none" : "block";
  document.getElementById("authSubmitBtn").dataset.mode = mode;
  document.getElementById("authError").style.display = "none";
}

function showAuthError(msg){
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.style.display = "block";
}

  document.getElementById("headerWordmark").src = LOGO_WORDMARK;

  if(currentProfile.role !== "Employee"){ await loadAccountingData(); }
  if(currentProfile.role === "Employee"){ await loadMyDevices(); }

}

    e.preventDefault();
    const current = document.getElementById("authSubmitBtn").dataset.mode;
    setAuthMode(current === "signup" ? "login" : "signup");
  };

  document.getElementById("blockedRetryBtn").onclick = async () => {
    const btn = document.getElementById("blockedRetryBtn");
    btn.disabled = true; btn.textContent = "Checking…";
    try{ await startApp(); }
    finally{ btn.disabled = false; btn.textContent = "Try Again"; }
  };
  document.getElementById("blockedLogoutBtn").onclick = signOutUser;

  document.getElementById("authForgotLink").onclick = async (e) => {
    e.preventDefault();
    const email = document.getElementById("auth_email").value.trim();
    if(!email){ showAuthError("Enter your email above first, then click \"Forgot password?\" again."); return; }
    const link = document.getElementById("authForgotLink");
    link.textContent = "Sending…";
    try{
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if(error){ showAuthError(error.message); return; }
      document.getElementById("authError").style.display = "none";
      toast("If an account exists for " + email + ", a reset link has been sent.");
    }catch(err){
      showAuthError(err.message || "Could not send reset email.");
    }finally{
      link.textContent = "Forgot password?";
    }
  };

  document.getElementById("authSubmitBtn").onclick = async () => {
    const mode = document.getElementById("authSubmitBtn").dataset.mode;
    const password = document.getElementById("auth_password").value;

    if(mode === "reset"){
      if(!password || password.length < 6){ showAuthError("Password must be at least 6 characters."); return; }
      document.getElementById("authSubmitBtn").disabled = true;
      try{
        const { error } = await sb.auth.updateUser({ password });
        if(error){ showAuthError(error.message); return; }
        const { data: { user } } = await sb.auth.getUser();
        currentUser = user;
        currentProfile = await loadProfile(currentUser.id);
        if(currentProfile.status !== "Approved"){
          const msg = new NotApprovedError(currentProfile.status).message;
          await sb.auth.signOut();
          currentUser = null; currentProfile = null;
          setAuthMode("login");
          showAuthError(msg);
          return;
        }
        toast("Password updated.");
        await startApp();
      }catch(err){
        showAuthError(err.message || "Something went wrong.");
      }finally{
        document.getElementById("authSubmitBtn").disabled = false;
      }
      return;
    }

    const email = document.getElementById("auth_email").value.trim();
    const name = document.getElementById("auth_name").value.trim();
    if(!email || !password){ showAuthError("Email and password are required."); return; }
    if(mode === "signup" && !name){ showAuthError("Please enter your name."); return; }
    document.getElementById("authSubmitBtn").disabled = true;
    try{
      let data;
      if(mode === "signup"){
        data = await signUpUser(email, password, name);
        sb.functions.invoke("send-signup-notification", { body: { email, name } })
          .catch(e=>console.error("Signup notification failed:", e));
        if(!data.session){
          showAuthError("Account request submitted. If email confirmation is enabled in your Supabase project, check your inbox and confirm first. An Admin must also approve your account before you can sign in.");
          setAuthMode("login");
          document.getElementById("authSubmitBtn").disabled = false;
          return;
        }
      } else {
        data = await signInUser(email, password);
      }
      currentUser = data.user;
      currentProfile = await loadProfile(currentUser.id);
      if(currentProfile.status !== "Approved"){
        const msg = new NotApprovedError(currentProfile.status).message;
        await sb.auth.signOut();
        currentUser = null; currentProfile = null;
        showAuthError(mode === "signup" ? "Account request submitted. " + msg : msg);
        setAuthMode("login");
        document.getElementById("authSubmitBtn").disabled = false;
        return;
      }
      await startApp();
    }catch(err){
      showAuthError(err.message || "Something went wrong.");
    }finally{
      document.getElementById("authSubmitBtn").disabled = false;
    }
  };

  try{
    const { data: { session } } = await sb.auth.getSession();
    document.getElementById("loadingOverlay").remove();
    if(session){
      currentUser = session.user;
      currentProfile = await loadProfile(currentUser.id);
      if(currentProfile.status !== "Approved"){
        const msg = new NotApprovedError(currentProfile.status).message;
        await sb.auth.signOut();
        currentUser = null; currentProfile = null;
        document.getElementById("authScreen").style.display = "block";
        showAuthError(msg);
      } else {
        await startApp();
      }
    } else {
      document.getElementById("authScreen").style.display = "block";
    }
  }catch(err){
    document.getElementById("loadingOverlay").remove();
    document.getElementById("authScreen").style.display = "block";
    showAuthError("Could not reach Supabase — check your Project URL and API key.");
  }
})();
</script>
</body>
</html>
